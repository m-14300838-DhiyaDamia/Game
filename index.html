<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Airplane IT Learning Game</title>
    <!-- Memuatkan pustaka Three.js yang betul melalui CDN cdnjs -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .form-container {
            background: rgba(20, 20, 45, 0.9);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px #00f3ff;
            padding: 40px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #00f3ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00f3ff;
            font-size: 26px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ff00ff;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ff00ff;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #00f3ff;
            box-shadow: 0 0 10px #00f3ff;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00f3ff, #ff00ff);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,255,0.5);
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.03);
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            z-index: 5;
            display: none;
            pointer-events: none;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .hud-box {
            background: rgba(10, 10, 30, 0.8);
            border: 1px solid #00f3ff;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        #question-box {
            background: rgba(10, 10, 30, 0.9);
            border: 2px solid #ff00ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }
        .option-guide {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
        }
        .guide-item {
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }
        .hide { display: none !important; }
        #status-msg {
            margin-top: 15px;
            color: #00ffcc;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="form-container">
            <h1>IT FLIGHT ACADEMY</h1>
            <p style="margin-bottom: 20px; color: #aaa;">Sila daftar untuk memulakan misi kuiz 3D</p>
            <div class="input-group">
                <label>NAMA PENUH:</label>
                <input type="text" id="student-name" placeholder="cth: Ahmad Bin Ali" required>
            </div>
            <div class="input-group">
                <label>NO. MATRIK:</label>
                <input type="text" id="student-matrix" placeholder="cth: DIT20261234" required>
            </div>
            <button id="start-btn">MULA PERMAINAN</button>
        </div>
    </div>

    <div id="end-screen" class="overlay-screen hide">
        <div class="form-container">
            <h1 id="end-title">MISI SELESAI!</h1>
            <p id="end-stats" style="margin: 20px 0; line-height: 1.6; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px;"></p>
            <div id="status-msg">Menyediakan data...</div>
            <button id="restart-btn" style="margin-top: 20px;" class="hide">MAIN SEMULA</button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-row">
            <div class="hud-box" style="color: #00f3ff;">ID: <span id="hud-student-info">-</span></div>
            <div class="hud-box" style="color: #ff00ff;">NYAWA: <span id="hud-lives">❤️❤️❤️</span></div>
            <div class="hud-box" style="color: #00ff00;">SKOR: <span id="hud-score">0</span></div>
        </div>
        <div id="question-box">
            <div style="font-size: 13px; color: #00f3ff; margin-bottom: 5px;">SOALAN <span id="current-q-num">1</span>/5</div>
            <div id="question-text">Memuatkan soalan...</div>
            <div id="options-list" class="option-guide"></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const IS_TEST_MODE = true; 
        const GOOGLE_SCRIPT_URL = ""; 

        const quizBank = [
            {
                question: "Manakah lapisan model OSI yang bertanggungjawab untuk routing IP data packet?",
                options: ["Data Link Layer", "Network Layer", "Transport Layer"],
                correctIndex: 1
            },
            {
                question: "Apakah prinsip utama pengurusan data bagi struktur data jenis STACK?",
                options: ["FIFO (First In First Out)", "LIFO (Last In First Out)", "Random Access"],
                correctIndex: 1
            },
            {
                question: "Kekunci manakah yang menghubungkan sesebuah jadual dengan jadual utama lain?",
                options: ["Primary Key", "Foreign Key", "Unique Key"],
                correctIndex: 1
            },
            {
                question: "Antara protokol berikut, yang manakah bersifat connectionless (tiada jaminan hantar)?",
                options: ["TCP", "UDP", "HTTP"],
                correctIndex: 1
            },
            {
                question: "Proses mengurangkan data lewah (redundancy) dalam pangkalan data dipanggil:",
                options: ["Normalization", "Indexing", "Encapsulation"],
                correctIndex: 0
            }
        ];

        let gameState = {
            studentName: "",
            matrixNum: "",
            score: 0,
            correctCount: 0,
            wrongCount: 0,
            currentQuestionIndex: 0,
            lives: 3,
            isPlaying: false
        };

        const loginScreen = document.getElementById('login-screen');
        const endScreen = document.getElementById('end-screen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let scene, camera, renderer, airplane, gates = [], stars;
        let targetX = 0, targetY = 0;
        let speed = 0.4;

        startBtn.addEventListener('click', () => {
            const nameInput = document.getElementById('student-name').value.trim();
            const matrixInput = document.getElementById('student-matrix').value.trim();

            if(nameInput === "" || matrixInput === "") {
                alert("Sila isi Nama dan No. Matrik terlebih dahulu!");
                return;
            }

            gameState.studentName = nameInput;
            gameState.matrixNum = matrixInput;
            
            document.getElementById('hud-student-info').innerText = matrixInput;
            loginScreen.classList.add('hide');
            hud.style.display = 'block';
            
            init3D(); 
            loadQuestion();
            gameState.isPlaying = true;
            animate();
        });

        function loadQuestion() {
            if(gameState.currentQuestionIndex >= quizBank.length) {
                endGame(true);
                return;
            }
            
            let q = quizBank[gameState.currentQuestionIndex];
            document.getElementById('current-q-num').innerText = gameState.currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = q.question;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            const labels = ["KIRI: ", "TENGAH: ", "KANAN: "];
            q.options.forEach((opt, idx) => {
                optionsList.innerHTML += `<div class="guide-item"><strong>${labels[idx]}</strong> ${opt}</div>`;
            });

            createGates();
        }

        function init3D() {
